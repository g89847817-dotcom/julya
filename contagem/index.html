<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contagem Regressiva</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e11d2e;
    --red-dark: #7a0a15;
    --bg: #0b0b0d;
    --text: #f4f4f5;
    --muted: #8a8a93;
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(225, 29, 46, .35), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, rgba(122, 10, 21, .45), transparent 60%),
      var(--bg);
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
    pointer-events: none;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 900px;
    text-align: center;
  }
  .names {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 10vw, 6rem);
    line-height: .95;
    letter-spacing: .02em;
    margin-bottom: 14px;
  }
  h1 span { color: var(--red); }
  .sub {
    color: var(--muted);
    font-weight: 300;
    letter-spacing: .08em;
    margin-bottom: 52px;
    font-size: clamp(.85rem, 2.4vw, 1rem);
    text-transform: uppercase;
  }
  .timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 44px;
  }
  .box {
    padding: 34px 6px;
    border-right: 1px solid var(--line);
  }
  .box:last-child { border-right: none; }
  .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 13vw, 7.5rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .box:first-child .num {
    color: var(--red);
    text-shadow: 0 0 40px rgba(225, 29, 46, .55);
  }
  .label {
    margin-top: 6px;
    font-size: clamp(.6rem, 1.8vw, .75rem);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .progress-head {
    display: flex;
    justify-content: space-between;
    font-size: .72rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .bar {
    height: 4px;
    background: var(--line);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red-dark), var(--red));
    box-shadow: 0 0 14px var(--red);
    transition: width 1s ease;
  }
  .final { display: none; }
  .final h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: clamp(3.5rem, 15vw, 9rem);
    line-height: .95;
    color: var(--red);
    text-shadow: 0 0 50px rgba(225, 29, 46, .6);
    margin-bottom: 12px;
  }
  .final p {
    color: var(--muted);
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  @media (max-width: 520px) {
    .box { padding: 22px 2px; }
    .sub { margin-bottom: 36px; }
  }
</style>
</head>
<body>

<main>
  <div id="counting">
    <div class="names">Guilherme &amp; Julya</div>
    <h1>Fim do preceito<br>em <span>12 de dezembro</span></h1>
    <p class="sub">Contagem regressiva pra nossa alegria</p>

    <div class="timer">
      <div class="box"><div class="num" id="d">00</div><div class="label">dias</div></div>
      <div class="box"><div class="num" id="h">00</div><div class="label">horas</div></div>
      <div class="box"><div class="num" id="m">00</div><div class="label">minutos</div></div>
      <div class="box"><div class="num" id="s">00</div><div class="label">segundos</div></div>
    </div>

    <div class="progress-head">
      <span>Progresso</span>
      <span id="pct">0%</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div class="final" id="final">
    <div class="names">Guilherme &amp; Julya</div>
    <h2>Chegou o dia.</h2>
    <p>Preceito concluído</p>
  </div>
</main>

<script>
  // ===== PERSONALIZE AQUI =====
  const DATA_FINAL  = new Date(2026, 11, 12, 0, 0, 0); // 12/12/2026 (mês 11 = dezembro)
  const DATA_INICIO = new Date(2026, 10, 9, 0, 0, 0);  // 09/11/2026 (início da contagem)
  // ============================

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const agora = new Date();
    const diff = DATA_FINAL - agora;

    if (diff <= 0) {
      $('counting').style.display = 'none';
      $('final').style.display = 'block';
      return;
    }

    $('d').textContent = pad(Math.floor(diff / 86400000));
    $('h').textContent = pad(Math.floor(diff / 3600000) % 24);
    $('m').textContent = pad(Math.floor(diff / 60000) % 60);
    $('s').textContent = pad(Math.floor(diff / 1000) % 60);

    const total = DATA_FINAL - DATA_INICIO;
    const feito = Math.min(100, Math.max(0, ((agora - DATA_INICIO) / total) * 100));
    $('fill').style.width = feito + '%';
    $('pct').textContent = feito.toFixed(1) + '%';
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
